services:
  stock-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_STOCK_API_BASE_URL: ${VITE_STOCK_API_BASE_URL:-}
        VITE_STOCK_API_KEY: ${VITE_STOCK_API_KEY:-}
        VITE_MOCK_FAILURE_RATE: ${VITE_MOCK_FAILURE_RATE:-0.18}
    ports:
      - "8080:80"
    restart: unless-stopped
